x-app: &app
  build: .
  image: papyruslm:latest
  restart: unless-stopped
  environment:
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    CHAT_MODEL: ${CHAT_MODEL:-phi4-mini}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - papyruslm-data:/app/data

services:
  api:
    <<: *app
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn papyruslm.main:app --host 0.0.0.0 --port 8000 --log-level info --proxy-headers --forwarded-allow-ips '*'
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *app
    command: papyruslm-worker
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-2m}
    volumes:
      - papyruslm-data:/app/data
      - huggingface-cache:/app/.cache/huggingface
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

volumes:
  papyruslm-data:
  huggingface-cache:
