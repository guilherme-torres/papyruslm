[project]
name = "papyruslm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "guilherme-torres", email = "guilhermetorres1401@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.148.0",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
papyruslm = "papyruslm:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
