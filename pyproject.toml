[project]
name = "papyruslm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "guilherme-torres", email = "guilhermetorres1401@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "av<19",
    "dishka>=1.10.1",
    "fastapi>=0.148.0",
    "faster-whisper>=1.2.1",
    "filetype>=1.2.0",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "liteparse>=2.17.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
papyruslm = "papyruslm:main"
papyruslm-worker = "papyruslm.adapters.inbound.worker:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
